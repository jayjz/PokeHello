<!DOCTYPE html>
<html>
<head>
  <title>PokeHello Dashboard</title>
  <style>
    /* TCG Color Palette from Coolors */
    /* Primary palette: Deep blues and holographic teals */
    /* https://coolors.co/0a1128-001f54-1282a2-00d9ff-fefcfb */
    /* Secondary: Pokemon TCG inspired */
    /* https://coolors.co/a82028-c85048-a8b8c8-304160-272536 */
    :root {
      --deep-blue: #0A1128;      /* Card back deep blue */
      --electric-blue: #001F54;   /* Electric type - https://coolors.co/001f54 */
      --holographic: #1282A2;     /* Holo foil - https://coolors.co/1282a2 */
      --neon-teal: #00D9FF;       /* Neon accent - https://coolors.co/00d9ff */
      --gold-foil: #FEFCFB;       /* Premium white - https://coolors.co/fefcfb */
      --charcoal: #1C1C1C;        /* Dark background */
      --tcg-red: #A82028;         /* Pokemon TCG red */
      --slate: #304160;           /* Slate blue */
    }
    
    body {
      margin: 0;
      font-family: 'Courier New', monospace;
      background: var(--charcoal);
      color: var(--gold-foil);
    }
    
    .header {
      background: linear-gradient(90deg, var(--deep-blue), var(--electric-blue));
      padding: 20px;
      border-bottom: 3px solid var(--neon-teal);
    }
    
    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    
    .card {
      background: var(--deep-blue);
      border: 2px solid var(--holographic);
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
    }
    
    .card h3 {
      color: var(--neon-teal);
      margin-top: 0;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    
    .log-container {
      background: #000;
      border: 1px solid var(--holographic);
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      font-size: 12px;
      margin: 20px;
    }
    
    .log-entry {
      margin: 2px 0;
      opacity: 0.9;
    }
    
    .log-entry.error { color: #ff4444; }
    .log-entry.success { color: #00ff88; }
    .log-entry.info { color: var(--neon-teal); }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚡ POKEHELLO CONTROL CENTER ⚡</h1>
    <div id="status">Connecting...</div>
  </div>
  
  <div class="status-grid">
    <div class="card">
      <h3>Active Monitors</h3>
      <div id="monitors">-</div>
    </div>
    <div class="card">
      <h3>Proxy Health</h3>
      <div id="proxies">-</div>
    </div>
    <div class="card">
      <h3>Success Rate</h3>
      <div id="success-rate">-</div>
    </div>
    <div class="card">
      <h3>Last Check</h3>
      <div id="last-check">-</div>
    </div>
  </div>
  
  <div class="log-container" id="logs"></div>
  
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const logsEl = document.getElementById('logs');
    const statusEl = document.getElementById('status');
    
    socket.on('connect', () => {
      statusEl.textContent = '🟢 CONNECTED';
      statusEl.style.color = '#00ff88';
    });
    
    socket.on('disconnect', () => {
      statusEl.textContent = '🔴 DISCONNECTED';
      statusEl.style.color = '#ff4444';
    });
    
    socket.on('log', (data) => {
      const entry = document.createElement('div');
      entry.className = `log-entry ${data.level}`;
      entry.textContent = `[${new Date(data.timestamp).toLocaleTimeString()}] ${data.message}`;
      logsEl.appendChild(entry);
      logsEl.scrollTop = logsEl.scrollHeight;
    });
    
    socket.on('metric', (data) => {
      const el = document.getElementById(data.name.replace('_', '-'));
      if (el) el.textContent = data.value;
    });
  </script>
</body>
</html>
